<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fee estimator has moved · dashhq</title>
    <script src="/dashhq/dashhq-shell.js"></script>
    <link rel="preload" href="/dashhq/fonts/archivo-latin-var.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/dashhq/dashhq-tokens.css">
    <link rel="stylesheet" href="/dashhq/dashhq-shell.css">
    <link rel="stylesheet" href="/dashhq/dashhq-components.css">
    <link rel="icon" href="/dashhq/mark/favicon.svg" type="image/svg+xml">
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>
    <dashhq-bar product="fees" network="mainnet" networks="mainnet testnet" sticky></dashhq-bar>
    <main id="app" class="dh-container dh-page">
      <header class="dh-page-header dh-narrow">
        <h1 class="dh-page-header__title">Fee estimator has moved into Explorer</h1>
        <p class="dh-page-header__lede">Same calculator, now beside your contracts and identities. Your network and contract stay with you.</p>
      </header>
      <div class="dh-notice dh-notice--info dh-narrow">
        <p>Opening Explorer’s fee tool in a moment.</p>
        <a id="fee-destination" class="dh-btn dh-btn--primary" href="https://explorer.dashhq.org/tools/fees/">Continue to Explorer →</a>
      </div>
    </main>
    <dashhq-footer product="fees" source="https://github.com/PastaPastaPasta/dash-contract-fee-estimator"></dashhq-footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
